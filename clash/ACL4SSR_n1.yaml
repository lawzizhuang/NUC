# N1 / OpenClash / Mihomo 模板（Sub-Store 注入节点后使用）
# 规则组织参考：https://github.com/dler-io/Rules/tree/main/Clash
# 保留 ACL4SSR 分流语义；兼容副本见 ruleset/n1/README.md。
# 发布时须同时发布 ruleset/n1/*.yaml；仅修改此文件不会更新 Sub-Store 的静态副本。
# OpenClash 可能覆写 DNS/监听等配置，以运行配置为准；不在此接管端口、认证或 TUN。
# 本模板修正规则兼容性，不保证解决 DNS/CDN/直连路径故障。

# ───────── DNS 配置 ─────────
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: false
  fake-ip-filter:
    - geosite:cn
    - connectivitycheck.gstatic.com
    - connectivitycheck.google.com
  # 国内解析器；Fake-IP 不保证真实解析结果正确，故障时需针对业务验证。
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 保留现有 fallback 策略；并非仅在主 DNS 失败时使用，也不保证可达。
  fallback:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 代理节点域名解析，避免依赖代理节点本身。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ───────── 连接优化 ─────────
keep-alive-interval: 30
unified-delay: true
global-client-fingerprint: chrome

# ───────── 协议嗅探 ─────────
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  force-domain:
    - '+.netflix.com'
    - '+.nflxvideo.net'

# ───────── 代理组 ─────────
