    exclude-filter: '(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|剩余|邮箱|套餐|更新|官网'
    proxies:
      - 自动选择
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - 香港节点
      - 手动切换
      - DIRECT
