# ACL4SSR_pro 优化模板
# 使用方式: 替换原本的 ACL4SSR_pro.yaml，sub-store 会在此模板基础上注入节点

# ───────── DNS 配置 ─────────
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: false
  fake-ip-filter:
    - geosite:cn
  # 国内 DNS (直连解析，不走代理)
  nameserver:
    - 114.114.114.114
    - 119.29.29.29
    - 223.5.5.5
  # 国外 DNS (DoH，走代理防污染)
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  # 代理节点域名专用的直连 DNS (避免 DNS 死锁)
  proxy-server-nameserver:
    - 114.114.114.114
    - 119.29.29.29

# ───────── 协议嗅探 ─────────
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  force-domain:
    - '+.netflix.com'
    - '+.nflxvideo.net'

# ───────── 代理组 ─────────
proxy-groups:
  - name: 节点选择
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
