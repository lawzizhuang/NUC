# ───────── 规则组 ─────────
# ACL4SSR .list 是带规则类型的纯文本：classical + text（包括 ChinaDomain/ChinaCompanyIp）。
# 带 payload 的兼容副本使用 classical + yaml；不混用 Surge/Quantumult 的规则语法。
# 媒体/下载兼容副本仅移除 URL-REGEX，不转换成可能扩大范围的域名规则。
rule-providers:
  LocalAreaNetwork:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list"
